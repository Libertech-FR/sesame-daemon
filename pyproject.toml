[project]
name = "sesame-daemon"
version = "1.0.17"
description = "Sésame daemon - Synchronisation d'Identités Multi-sources"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "bullmq>=2.15",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "redis>=5.0",
]

[project.scripts]
sesame-daemon = "sesame_daemon.main:run"

[dependency-groups]
dev = [
    "pyinstaller>=6.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "watchfiles>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sesame_daemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
